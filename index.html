<style>
html,body{background:#ffffff !important;background-color:#ffffff !important}

/* === SPLASH (layer 1) === */
.splash{
  position:fixed;inset:0;z-index:100;
  background:#ffffff !important;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:32px;
  padding:60px 56px;
  cursor:pointer;
  opacity:1;
  transition:opacity 1.6s var(--ease), visibility 0s linear 1.6s;
  overflow:hidden;
}
.splash.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

/* 純白過渡層（瞬間切換） */
.fade-tint{
  position:fixed;inset:0;z-index:150;
  background:#ffffff !important;
  opacity:0;visibility:hidden;
  pointer-events:none;
  transition:none;
}
.fade-tint.in{opacity:1;visibility:visible}

.splash .col{
  display:flex;flex-direction:column;justify-content:flex-start;
  font-family:'Inter','Noto Sans TC',sans-serif;
  font-weight:200;
  color:#7ba89c;
  font-size:13px;
  line-height:2.1;
  letter-spacing:.06em;
  overflow:hidden;
}
.splash .col .line{
  opacity:0;
  white-space:pre-wrap;
  word-break:break-word;
}
.splash .col .line.in{animation:typeIn .5s var(--ease) forwards}
@keyframes typeIn{
  from{opacity:0;transform:translateX(-4px)}
  to{opacity:1;transform:translateX(0)}
}

/* top hint */
.splash-hint{
  position:absolute;top:24px;left:56px;right:56px;
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.32em;
  text-transform:uppercase;color:#7ba89c;opacity:.55;
  pointer-events:none;
}

/* bottom image — transparent PNG */
.splash-poster{
  position:absolute;bottom:38px;left:calc(80% + 4px);
  width:min(34vw,540px);aspect-ratio:16/9;
  background:transparent;
  box-shadow:none;
  outline:none;
  border:none;
  opacity:1;
  pointer-events:none;
}
.splash-poster img{
  position:absolute;inset:0;
  width:100%;height:100%;object-fit:contain;display:block;
  background:transparent;
  opacity:0;
  transition:opacity 1.4s var(--ease);
  filter:drop-shadow(0 4px 16px rgba(28,26,24,.08));
}
.splash-poster img.active{opacity:1}
/* === HOME (layer 2) === */
.home{
  opacity:1;            /* 永遠不透明 */
  background:#ffffff !important;
  transition:none;      /* 不淡入 */
}

/* === home content styles (kept from previous) === */
.cover{position:relative;min-height:100vh;padding:0 40px;display:grid;place-items:center;overflow:hidden;background:#ffffff !important}
.cover-inner{position:relative;width:100%;max-width:1400px;height:100vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:60px}
.cover-text{position:relative;z-index:2}
.cover-eyebrow{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.42em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:32px;display:flex;align-items:center;gap:14px;opacity:0;transform:translateY(20px);animation:rise .9s var(--ease) .2s forwards}
.cover-eyebrow::before{display:none}
.cover-title{font-family:'Noto Serif TC',serif;font-weight:200;font-size:clamp(72px,12vw,180px);line-height:.92;letter-spacing:.04em;margin:0;color:var(--ink);position:relative}
.cover-title .char{display:inline-block;opacity:0;transform:translateY(60px) rotate(2deg);animation:charRise 1.2s var(--ease) forwards}
.cover-title .zh{display:block}
.cover-title .en{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:.45em;color:var(--peach);letter-spacing:.18em;display:block;margin-top:18px;padding-left:.04em}
.cover-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;line-height:1.5;color:var(--ink-soft);margin:36px 0 0;max-width:440px;opacity:0;transform:translateY(20px);animation:rise .9s var(--ease) 1.4s forwards}
.cover-meta{position:absolute;bottom:60px;left:0;display:flex;gap:32px;font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-mute);opacity:0;animation:rise .9s var(--ease) 1.6s forwards}
.cover-meta b{font-weight:500;color:var(--ink);display:block;font-size:12px;letter-spacing:.18em;text-transform:none;margin-top:6px;font-family:'Noto Serif TC',serif}
.cover-scroll{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);font-family:'Inter',sans-serif;font-size:9px;letter-spacing:.42em;text-transform:uppercase;color:var(--ink-mute);opacity:0;animation:fadein 1.2s var(--ease) 2s forwards}
.cover-scroll::after{display:none}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes charRise{to{opacity:1;transform:translateY(0) rotate(0)}}
@keyframes fadein{to{opacity:.7}}
@keyframes scrollpulse{0%,100%{transform:scaleY(1);opacity:.4}50%{transform:scaleY(1.3);opacity:1}}

.cover-art{position:relative;height:80vh;display:flex;align-items:center;justify-content:center;perspective:1200px}
.cover-art .layer{position:absolute;border-radius:2px;box-shadow:0 30px 80px rgba(28,26,24,.18);overflow:hidden;will-change:transform}
.cover-art .layer img{width:100%;height:100%;object-fit:cover;display:block}
.cover-art .l1{width:62%;height:80%;top:8%;left:8%;z-index:2;transform:rotate(-3deg)}
.cover-art .l2{width:48%;height:62%;bottom:4%;right:2%;z-index:1;transform:rotate(4deg);opacity:.95}
.cover-art .l3{width:32%;height:38%;top:18%;right:18%;z-index:3;transform:rotate(-1deg)}

/* === responsive === */
@media (max-width:1100px){
  .splash{grid-template-columns:repeat(2,1fr);gap:24px;padding:80px 32px 200px}
  .splash .col:nth-child(3){grid-column:span 2}
  .splash-poster{width:min(40vw,260px);bottom:36px;left:calc(50vw + 16px);right:auto}
  .splash-hint{left:32px;right:32px}
}
@media (max-width:700px){
  .splash{
    display:block;
    padding:86px 28px 104px;
    overflow:hidden;
    text-align:center;
  }
  .splash .col{display:none}
  .splash #col1{display:flex;position:absolute;top:84px;left:28px;right:28px;bottom:44vh;padding-top:18px;font-size:13px;line-height:1.95;letter-spacing:.06em;color:#6f9f94;max-width:none;align-items:flex-start;justify-content:center;overflow:hidden}
  .splash #col1 .line{white-space:pre-wrap;text-align:center}
  .splash-poster{
    position:absolute;
    left:50%;
    right:auto;
    bottom:92px;
    transform:translateX(-50%);
    width:min(68vw,330px);
    margin:0;
  }
  .splash-hint{top:22px;left:24px;right:24px;font-size:9px;letter-spacing:.24em;opacity:.55}
  .splash::after{
    content:'click';
    position:absolute;bottom:46px;left:50%;transform:translateX(-50%);
    font-family:'Inter',sans-serif;font-size:9px;letter-spacing:.34em;text-transform:uppercase;
    color:#7ba89c;opacity:.55;pointer-events:none;
  }
}

<script>
/* === SPLASH data + typewriter (two phases) === */
(function(){
  const ROUND1 = {
    1: `早上客廳傳來吵罵聲
有一個瞬間覺得自己回到小時候被罰
小時的束手無策在睡眼惺忪中循環：害怕 仇恨 撫慰
可明明已經長大到擁有擊倒敵人的能力

大概也是生命中這樣不能坦露的時刻
埋在骨裡成為引子
造成人與人之間的吸引
導致你抱我 我抱你的時候
像抱著碎掉的自己一樣

導致 我們之間的模糊`,
    2: `五月份的回憶會在每年這個時候再次衝擊
這是身體內你的記憶

歡欣過後 閃亮的指甲會特別諷刺
你問我為什麼要走 怕我愛你

9564

所有質地在晚上堆疊
失竊 暈眩 新鮮感
清醒的時候都會一抹而去
剩下的模糊令人不想說清
可是潮濕 明確的事實

The beginning is always the fin`,
    3: `我把你留下的衣服丟進洗衣機洗了兩遍
重新噴上你的香水 可不是你的味道
直逼30度的日子 城市下雨抑鬱
我們有各自的潮濕`,
    4: `當迪斯高球轉動起來時
掌心抓住的光的鱗片
本來就是無窮無盡的虛幻

收放 收放
像你譜寫的影像旋律般
有時窒息 難以呼吸
你用絮語填滿的節奏
是不是想蓋過心的聲音`,
    5: `原來對你的恨常常會在慣有的形式中渲發到別人的身人
一旦事情不如預期發展
那種倔便會散發

感謝天對於我的念念不忘寫下答案
因為我的快樂始終沒有辦法
包裹你們的哀傷

難道喜歡陰影是我們的基因嗎？`
  };

  const ROUND2 = {
    1: `很懷念我們一開始時的狀態
因為它很難 所以會懷念

你走了以後
我開始思考邊界的問題
我們都有一點把界線畫得很死
可我們又希望感受到的範圍更大

你的影像便有這種感覺
它們有些很灰矇
在邊界之間豫猶
毫厘之間的差異
我開始考量`,
    2: `一直想找尋得到拯救的出口
從一開始如白紙一般 到
後來使用技巧 但也是在消耗自己
得到與失去總是平衡地出現`,
    3: `有些人在談論自己情感撕心裂肺
可是比起平淡的折磨
根本不值一得

那些願意把自己置身於柴米油鹽的慢性折磨的人們
可能遠比浪漫主義的人更懂得如何體會痛楚
並願意接受生活就是有快樂同時有痛楚
他們知道生活在發生 而且是緩慢的`,
    4: `浪漫主義的人 喜歡看見血流成河
自己躺在血浴中
又或者丟人進去
他們喜歡遇溺的感覺
告訴世界自己要死了
又或者把人封閉在凝固的血色之中

記憶如同泡泡
在果凍狀的血內封閉起來`
  };

  const LINE_DELAY = 280;
  const CHAR_DELAY = 30;
  const ROUND_HOLD = 300;   // ms to hold round 1 before fading
  const ROUND_FADE = 800;   // ms fade duration between rounds
  const ROUND2_COLOR = '#e89a7a';  // peach

  function clearCols(){
    [1,2,3,4,5].forEach(i => {
      const c = document.getElementById('col' + i);
      if (c){ c.innerHTML = ''; c.style.color = ''; }
    });
  }

  function setRoundColor(color){
    [1,2,3,4,5].forEach(i => {
      const c = document.getElementById('col' + i);
      if (!c) return;
      c.style.transition = 'none';
      c.style.color = color;
      // force browser to apply the change immediately
      c.offsetHeight;
      setTimeout(() => { c.style.transition = ''; }, 50);
    });

  }

  function runRound(POEMS, isRound2, onDone){
    // figure out which columns are visible (CSS hides some on small screens)
    const isMobile = window.innerWidth < 700;
    const isRound2Mobile = isMobile && POEMS === ROUND2;
    const visibleKeys = Object.keys(POEMS).filter(k => {
      const col = document.getElementById('col' + k);
      if (!col) return false;
      if (isRound2Mobile) return parseInt(k) === 1;  // mobile round 2: one readable poem
      if (isMobile) return parseInt(k) === 1;        // mobile round 1: one readable poem
      return true;                                   // desktop: all columns
    });
    // first find max lines to know when typing finishes
    let maxLines = 0;
    visibleKeys.forEach((k) => {
      const n = POEMS[k].split('\n').filter(l => l.length > 0).length;
      if (n > maxLines) maxLines = n;
    });
    // schedule typing
    visibleKeys.forEach((k) => {
      const col = document.getElementById('col' + k);
      if (!col) return;
      const lines = POEMS[k].split('\n').filter(l => l.length > 0);
      const lineEls = lines.map((text) => {
        const el = document.createElement('div');
        el.className = 'line';
        el.textContent = text;
        col.appendChild(el);
        return el;
      });
      lineEls.forEach((el, i) => {
        setTimeout(function(){
          if (isMobile) fadeLineIn(el, isRound2 ? ROUND2_COLOR : '#7ba89c');
          else if (isRound2) typeCharsWithColor(el, '#7ba89c', ROUND2_COLOR);
          else typeChars(el);
        }, i * LINE_DELAY);
      });
    });
    // fire onDone after typing finishes
    const totalMs = (maxLines - 1) * LINE_DELAY + 3000;
    setTimeout(function(){ if (onDone) onDone(); }, totalMs);
  }

  function typeChars(el){
    const text = el.textContent;
    el.textContent = '';
    el.classList.add('in');
    let i = 0;
    const t = setInterval(() => {
      el.textContent += text[i];
      i++;
      if (i >= text.length) clearInterval(t);
    }, CHAR_DELAY);
  }

  function fadeLineIn(el, color){
    el.style.color = color;
    el.classList.add('in');
  }

  // per-char color tween — when a new char appears in round 2,
  // fade it in from round 1 color (teal) to round 2 color (peach)
  function typeCharsWithColor(el, fromColor, toColor){
    const text = el.textContent;
    el.textContent = '';
    el.classList.add('in');
    let i = 0;
    const t = setInterval(() => {
      const ch = text[i];
      const span = document.createElement('span');
      span.textContent = ch;
      // start at fromColor, then tween to toColor
      span.style.color = fromColor;
      span.style.transition = `color 500ms ease`;
      el.appendChild(span);
      requestAnimationFrame(() => { span.style.color = toColor; });
      i++;
      if (i >= text.length) clearInterval(t);
    }, CHAR_DELAY);
  }

  function fadeRound1Out(onDone){
    const lines = document.querySelectorAll('#splash .line');
    lines.forEach((el, i) => {
      setTimeout(() => { el.style.transition = 'opacity 250ms ease'; el.style.opacity = '0'; }, i * 8);
    });
    const totalFadeMs = lines.length * 8 + 350;
    setTimeout(() => {
      clearCols();
      if (onDone) onDone();
    }, totalFadeMs);
  }

  function setSplashPoster(round){
    document.querySelectorAll('#splashPoster img').forEach(img => {
      img.classList.toggle('active', img.dataset.poster === round);
    });
  }

  function fadeRound2In(){
    setSplashPoster('round2');
    setRoundColor(ROUND2_COLOR);
    runRound(ROUND2, true);
  }

  // main sequence
  function start(){
    runRound(ROUND1, false, function(){
      setTimeout(() => {
        fadeRound1Out(fadeRound2In);
      }, ROUND_HOLD);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }

  // click splash → enter home
  const splash = document.getElementById('splash');
  const home = document.getElementById('home');
  function enterHome(){
    if (splash.classList.contains('hidden')) return;
    home.classList.add('in');
    requestAnimationFrame(() => {
      splash.classList.add('hidden');
    });
  }
  splash.addEventListener('click', enterHome);
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') enterHome();
  });
})();
</script>
