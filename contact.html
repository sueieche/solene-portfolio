<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — Solène Su Cheng</title>
<link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
<link rel="shortcut icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&family=Noto+Sans+TC:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
body::before{content:"";position:fixed;top:0;left:0;right:0;height:96px;background:linear-gradient(to bottom,#fff 0%,#fff 58%,rgba(255,255,255,0) 100%);z-index:999;pointer-events:none}
.site-nav{z-index:1000;background:#fff;font-family:'Inter','Noto Sans TC',sans-serif}
.shop-page{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:120px 40px 80px;
  background:#fff;
}
.shop-inner{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:24px;
}
.shop-image{
  width:min(35.7vw,442px);
  max-height:58vh;
  object-fit:contain;
  display:block;
}
.shop-note{
  margin:0;
  font-family:'Inter','Noto Sans TC',sans-serif;
  font-size:13px;
  font-weight:300;
  letter-spacing:.06em;
  color:#7ba89c;
}
@media (max-width:960px){
  .site-nav{top:18px;left:20px;width:calc(100vw - 40px);font-size:14px;gap:8px 18px;flex-wrap:wrap;justify-content:flex-start;line-height:1.5}
  .site-nav .name{font-size:16px;flex:0 0 100%}
  .site-nav .sep{display:none}
  .shop-page{padding:124px 24px 72px}
  .shop-inner{gap:20px}
  .shop-image{width:min(76vw,420px);max-height:48vh}
  .shop-note{font-size:12px;text-align:center}
}
</style>
</head>
<body>

<nav class="nav site-nav" id="nav">
  <a class="name" href="index.html">Solène Su Cheng</a>
  <span class="sep">—</span>
  <a href="index.html">Home</a>
  <span class="sep">—</span>
  <a href="work.html">Work</a>
  <span class="sep">—</span>
  <a href="info.html">Info</a>
  <span class="sep">—</span>
  <a href="contact.html" class="active">Shop</a>
</nav>

<main class="shop-page">
  <div class="shop-inner">
    <img class="shop-image" src="img_splash/splash_02.png" alt="">
    <p class="shop-note">BOOK! see you in August</p>
  </div>
</main>

</body>
</html>
